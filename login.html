<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1207">
<title>Sign In — Rhythm space</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Rhythm space <em>music workspace</em></div>

    <div class="auth-tabs">
      <button class="auth-tab active" type="button" data-mode="signin">Sign In</button>
      <button class="auth-tab" type="button" data-mode="signup">Create Account</button>
    </div>

    <form id="auth-form" novalidate>
      <div class="field" id="field-name" hidden>
        <label for="auth-name">Name</label>
        <input id="auth-name" type="text" autocomplete="name" placeholder="e.g. Ada Lovelace">
      </div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <div class="auth-error" id="auth-error"></div>

      <button class="btn btn-primary auth-submit" type="submit" id="auth-submit">Sign In</button>
    </form>

    <div class="auth-hint" id="auth-hint">
      Accounts are stored on this device for now — no server yet.
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  // Already signed in? Skip straight to the dashboard.
  if (window.RymAuth.getCurrentUser()) {
    window.location.replace('dashboard.html');
  }

  let mode = 'signin'; // 'signin' | 'signup'

  const tabs      = document.querySelectorAll('.auth-tab');
  const fieldName = document.getElementById('field-name');
  const nameInput = document.getElementById('auth-name');
  const emailInput= document.getElementById('auth-email');
  const pwInput   = document.getElementById('auth-password');
  const submitBtn = document.getElementById('auth-submit');
  const errorEl   = document.getElementById('auth-error');
  const hintEl    = document.getElementById('auth-hint');
  const form      = document.getElementById('auth-form');

  function setMode(next) {
    mode = next;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    fieldName.hidden = mode !== 'signup';
    pwInput.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    submitBtn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
    hintEl.textContent = mode === 'signup'
      ? 'Your account stays on this device for now — no server yet.'
      : 'Accounts are stored on this device for now — no server yet.';
    errorEl.textContent = '';
  }

  tabs.forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.mode)));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorEl.textContent = '';
    submitBtn.disabled = true;

    try {
      if (mode === 'signup') {
        await window.RymAuth.signUp(emailInput.value, pwInput.value, nameInput.value);
      } else {
        await window.RymAuth.signIn(emailInput.value, pwInput.value);
      }
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message || 'Something went wrong. Try again.';
      submitBtn.disabled = false;
    }
  });

  // Register PWA service worker (same as index.html)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
